[package]
name = "local-model-residency"
version = "0.1.1"
description = "See which local runtime holds each model and when it reloads"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-local-model-residency"
edition = "2021"

[lib]
name = "local_model_residency_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sysinfo = "0.37.0"
tauri = { version = "2.8.5", features = ["tray-icon"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
